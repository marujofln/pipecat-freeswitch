[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pipecat-freeswitch"
version = "0.1.0"
description = "Pipecat integration for FreeSWITCH via the mod_audio_stream WebSocket module."
readme = "README.md"
license = "BSD-2-Clause"
license-files = ["LICENSE"]
requires-python = ">=3.12"
authors = [{ name = "Marcelo Araujo", email = "marujofln@gmail.com" }]
keywords = ["pipecat", "freeswitch", "voice-ai", "telephony", "websocket", "voice-agent"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: BSD License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Communications :: Telephony",
    "Topic :: Multimedia :: Sound/Audio",
]
# The ESL client is implemented on asyncio streams, so no extra dependency is needed.
dependencies = [
    "pipecat-ai>=1.14.0",
]

[project.urls]
Repository = "https://github.com/marujofln/pipecat-freeswitch"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5",
    "ruff>=0.6",
    # tests/test_integration.py: the real transport, served by uvicorn, with a websockets client.
    "pipecat-ai[websocket]>=1.14.0",
    "uvicorn>=0.30",
    "websockets>=13",
]
bench = [
    "pipecat-ai[websocket]>=1.14.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
]

[tool.hatch.build.targets.wheel]
packages = ["src/pipecat_freeswitch"]

# An explicit list: hatch only honors the root .gitignore, so without it the sdist picked up local bench
# captures (examples/freeswitch/captures/ has its own .gitignore) and other working files.
[tool.hatch.build.targets.sdist]
only-include = [
    "src/pipecat_freeswitch",
    "tests",
    "examples/bot.py",
    "README.md",
    "CHANGELOG.md",
    "LICENSE",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["tests"]
addopts = "--strict-markers"
markers = [
    "integration: real Pipecat pipeline and transport in process (deselect with '-m \"not integration\"')",
]

[tool.coverage.run]
source = ["pipecat_freeswitch"]
branch = true

[tool.coverage.report]
fail_under = 95
show_missing = true

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "D"]
ignore = ["D105", "D107"]
pydocstyle = { convention = "google" }

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D"]

[tool.ruff.lint.isort]
known-first-party = ["pipecat_freeswitch", "fake_esl"]
