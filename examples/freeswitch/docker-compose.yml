# Phase-0 test bench: FreeSWITCH + mod_audio_stream + echo WebSocket server.
# Dial extension 9999 (SIP user 1000, password 1234) to reach the echo server.
services:
  freeswitch:
    build: .
    network_mode: host   # RTP over NAT-less host networking is the simplest for SIP softphones
    volumes:
      - ./conf/vars.xml:/usr/local/freeswitch/etc/freeswitch/vars.xml:ro
      - ./conf/freeswitch.xml:/usr/local/freeswitch/etc/freeswitch/freeswitch.xml:ro
      - ./conf/autoload_configs:/usr/local/freeswitch/etc/freeswitch/autoload_configs:ro
      - ./conf/dialplan:/usr/local/freeswitch/etc/freeswitch/dialplan:ro
      - ./conf/sip_profiles:/usr/local/freeswitch/etc/freeswitch/sip_profiles:ro
      - ./conf/directory:/usr/local/freeswitch/etc/freeswitch/directory:ro
      - ./captures:/captures   # caller-side recordings from bench/run_experiments.py
    environment:
      STREAM_BUFFER_SIZE: "20"

  echo:
    build:
      context: ../../bench
    network_mode: host
    environment:
      FS_ESL_HOST: 127.0.0.1
      FS_ESL_PORT: "8021"
      FS_ESL_PASSWORD: ClueCon
      ECHO_PORT: "8765"
      OUT_SAMPLE_RATE: "16000"
      CHUNK_MS: "300"
      MODE: echo
      CAPTURE_DIR: /captures
    volumes:
      - ./captures:/captures
    depends_on: [freeswitch]

  # The example voice bot (examples/bot.py, STT -> LLM -> TTS) on extension 9996. Needs API keys, so it only
  # starts with its profile: docker compose --profile bot up -d. Keys come from the repository's .env.
  bot:
    profiles: [bot]
    build:
      context: ../..
      dockerfile: examples/bot.Dockerfile
    network_mode: host
    env_file:
      - path: ../../.env
        required: false
    environment:
      HOST: 127.0.0.1             # FreeSWITCH shares the host network; nothing else needs to reach the bot
      PORT: "8767"                # 8765 is the echo server, 8766 the bench's tone bot
      BOT_TOKEN: bench-token      # must match bot_token in conf/vars.xml (overrides .env on purpose)
      FREESWITCH_ESL_HOST: 127.0.0.1
    depends_on: [freeswitch]

  # Packet capture for bench/rtp_wire.py (not started by default: docker compose --profile tools ...).
  tcpdump:
    profiles: [tools]
    build:
      dockerfile_inline: |
        FROM debian:12-slim
        RUN apt-get update && apt-get install -y --no-install-recommends tcpdump && rm -rf /var/lib/apt/lists/*
        ENTRYPOINT ["tcpdump"]
    network_mode: host
    cap_add: [NET_RAW, NET_ADMIN]
    volumes:
      - ./captures:/captures
