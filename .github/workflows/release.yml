name: Release

# Publishes to PyPI when a version tag is pushed (git tag v0.1.0 && git push origin v0.1.0), then creates
# the GitHub release with the version's CHANGELOG.md section as notes and the published files attached.
# Uses PyPI trusted publishing, so no token is stored in the repository. One-time setup on pypi.org:
# add a trusted publisher for project "pipecat-freeswitch", owner "marujofln", repository
# "pipecat-freeswitch", workflow "release.yml", environment "pypi".

on:
  push:
    tags: ["v*"]

# Read-only by default; only the publish job gets an OIDC token for trusted publishing, and only the
# github-release job may write to the repository.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: "3.12"
      - name: Check that the tag matches the package version
        run: |
          version=$(uv run --no-project python -c "import re, pathlib; print(re.search(r'__version__ = \"(.+)\"', pathlib.Path('src/pipecat_freeswitch/__init__.py').read_text()).group(1))")
          test "v$version" = "${GITHUB_REF_NAME}" || { echo "tag ${GITHUB_REF_NAME} != v$version"; exit 1; }
      - name: Check that CHANGELOG.md has notes for the version
        run: python3 .github/scripts/release_notes.py "${GITHUB_REF_NAME}"
      - name: Tests
        run: uv run --locked --group dev pytest
      - name: Build
        run: uv build
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write  # trusted publishing
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write  # create the release
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 .github/scripts/release_notes.py "${GITHUB_REF_NAME}" > notes.md
          # PEP 440 pre-releases (0.3.0a1, 0.3.0rc1, ...) are marked as such and never become "latest".
          case "${GITHUB_REF_NAME#v}" in
            *[a-z]*) kind=--prerelease ;;
            *) kind=--latest ;;
          esac
          gh release create "${GITHUB_REF_NAME}" --verify-tag --title "${GITHUB_REF_NAME}" \
            --notes-file notes.md "$kind" dist/*
